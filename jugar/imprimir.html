<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versión imprimible — Vestigia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23f4ead0' stroke='%239c2b1f' stroke-width='5'/%3E%3Cpath d='M50 14 L60 45 L50 86 L40 45 Z' fill='%239c2b1f'/%3E%3Cpath d='M14 50 L45 40 L86 50 L45 60 Z' fill='%23241a10' opacity='0.65'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>

<header class="cabecera">
  <div class="contenedor">
    <a class="marca" href="../index.html" aria-label="Vestigia — inicio">
      <svg class="marca__icono" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="3" fill="currentColor"/>
        <path d="M50 10 L58 42 L50 50 L42 42 Z" fill="currentColor"/>
        <path d="M50 90 L58 58 L50 50 L42 58 Z" fill="currentColor" opacity="0.35"/>
        <path d="M10 50 L42 42 L50 50 L42 58 Z" fill="currentColor" opacity="0.35"/>
        <path d="M90 50 L58 58 L50 50 L58 42 Z" fill="currentColor" opacity="0.35"/>
      </svg>
      <span class="marca__texto">
        <span class="marca__nombre">Vestigia</span>
      </span>
    </a>
  </div>
</header>

<main>
  <div id="vista-cargando" class="pantalla-centrada">
    <div class="girando" role="status" aria-label="Cargando"></div>
    <p class="pantalla-centrada__texto" data-i18n="juego_cargando">Cargando tu ruta…</p>
  </div>

  <div id="vista-error" class="pantalla-centrada" hidden>
    <h1 class="pantalla-centrada__titulo" data-i18n="juego_error_titulo"></h1>
    <p class="pantalla-centrada__texto" id="txt-error"></p>
    <a class="btn btn-lacre" href="../index.html#ciudades" data-i18n="juego_error_cta"></a>
  </div>

  <article id="hoja" class="hoja-imprimir" hidden>
    <div class="hoja-imprimir__cabecera">
      <p class="hoja-imprimir__marca" data-i18n="imprimir_marca">Versión imprimible</p>
      <h1 class="hoja-imprimir__titulo" id="txt-titulo"></h1>
      <p class="hoja-imprimir__intro" id="txt-intro"></p>
      <p class="hoja-imprimir__meta" id="txt-punto-partida"></p>
    </div>

    <div class="hoja-imprimir__acciones">
      <button type="button" class="btn btn-lacre" id="btn-imprimir" data-i18n="imprimir_btn_print">Imprimir / Guardar como PDF</button>
    </div>

    <div id="lista-paradas"></div>

    <section class="seccion-respuestas">
      <p class="seccion-respuestas__aviso" data-i18n="imprimir_respuestas_aviso"></p>
      <div id="lista-respuestas"></div>
    </section>
  </article>
</main>

<script type="module" src="../js/imprimir.js"></script>
</body>
</html>
