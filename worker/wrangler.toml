[vars]
# TODO: actualizar cuando se confirme el dominio definitivo (ver plan,
# "Pendiente de ti"). Por ahora apunta al sitio publicado en GitHub Pages
# (github.io/vestigia) — sin dominio propio todavía. ALLOWED_ORIGIN es solo
# esquema+host (así funciona el header Origin del navegador, sin ruta);
# SITE_URL sí lleva la ruta del proyecto porque se concatena en enlaces
# completos (ver worker/src/stripe.js y worker/src/resend.js).
SITE_URL = "https://pierorepp90.github.io/vestigia"
ALLOWED_ORIGIN = "https://pierorepp90.github.io"
OWNER_EMAIL = "pierorepp90@gmail.com"

# Secretos (NUNCA en este archivo — se versiona en git). Configurar con:
#   wrangler secret put TOKEN_SECRET
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
# TOKEN_SECRET: cualquier cadena aleatoria larga (p. ej. `openssl rand -hex 32`).
# STRIPE_SECRET_KEY / RESEND_API_KEY: se añaden en el paso 5 del plan (Pago y acceso).
