name = "vestigia-api"
main = "src/index.js"
compatibility_date = "2026-07-29"
account_id = "a758cd1019845ef9a66297e93da0c5b0"

[vars]
# vestigia.fun es el dominio propio del sitio (GitHub Pages con CNAME).
# ALLOWED_ORIGIN es solo esquema+host (así funciona el header Origin del
# navegador, sin ruta); SITE_URL se concatena en enlaces completos (ver
# worker/src/stripe.js y worker/src/resend.js). Debe coincidir con BASE_URL
# en scripts/sitio-i18n.mjs y BASE_URL_SITIO en js/i18n.js.
SITE_URL = "https://vestigia.fun"
ALLOWED_ORIGIN = "https://vestigia.fun"
OWNER_EMAIL = "pierorepp90@gmail.com"

# Rate limiting: cubo por IP+acción (worker/src/throttle.js) y marca de
# "pedido cumplido" para no reenviar emails (worker/src/cumplimiento.js).
# Falla en abierto: si el binding no está, el Worker sigue funcionando.
[[kv_namespaces]]
binding = "KV"
id = "210551e0eede45ed9b80c1cc358c85ad"
preview_id = "818a61a4540e42a7be4919380625fdd7"

# Secretos (NUNCA en este archivo — se versiona en git). Configurar con:
#   wrangler secret put TOKEN_SECRET
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_SECRET   # frase larga para el panel /admin/votos.html
#   wrangler secret put IP_SALT        # openssl rand -hex 16 — sal para el hash de IP de los votos
# TOKEN_SECRET: cualquier cadena aleatoria larga (p. ej. `openssl rand -hex 32`).
# STRIPE_SECRET_KEY / RESEND_API_KEY: se añaden en el paso 5 del plan (Pago y acceso).

[[d1_databases]]
binding = "DB"
database_name = "vestigia-db"
database_id = "620687ad-e060-44ef-b3b8-b6dcc53e5449"
migrations_dir = "migrations"
